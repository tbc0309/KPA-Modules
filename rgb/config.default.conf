# 亮度上限 1–255，建议 40–80。
# Brightness limit, 1-255. Recommended: 40-80.
MAX_BRIGHTNESS=64
# 温度警告阈值，单位为摄氏度。
# Temperature warning thresholds in Celsius.
CPU_TEMP_WARN=85
CPU_TEMP_DANGER=90
BATTERY_TEMP_WARN=50
BATTERY_TEMP_DANGER=55
# 电量低于或等于此值时，由 Android 控制电池灯。
# At or below this level, Android owns the battery LED.
BATTERY_LOW=15
# 动画间隔，单位为秒；小于 0.20 的配置忽略，使用默认值。
# Animation interval in seconds. Values below 0.20 are ignored, using the default.
INTERVAL=0.20
